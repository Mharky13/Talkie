services:
  - type: web
    name: talkie-api
    runtime: python
    rootDir: chat-application
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TALKIE_TOKEN_SECRET
        generateValue: true
      - key: TALKIE_ALLOWED_ORIGINS
        sync: false
      - key: TALKIE_DATABASE_URL
        sync: false